name: flyleaf drift check
description: Report when AI code changed and its documentation did not, with EU AI Act citations.
author: Krishna Dahale
branding:
  icon: book-open
  color: green

inputs:
  base:
    description: Git ref to compare from. Leave empty when using the baseline.
    required: false
    default: ""
  head:
    description: Git ref to compare to. Defaults to the working tree.
    required: false
    default: ""
  baseline:
    description: Compare against .flyleaf/baseline.json instead of a git ref.
    required: false
    default: "true"
  fail-on:
    description: "Exit 1 when an active finding reaches this severity: none, low, medium, or high."
    required: false
    default: none
  path:
    description: Repository to read.
    required: false
    default: "."
  sarif-file:
    description: Where to write the SARIF report.
    required: false
    default: flyleaf.sarif
  comment:
    description: Post the brief as a pull request comment, updated in place on each run.
    required: false
    default: "true"
  github-token:
    description: Token used to post the comment. Needs pull-requests write.
    required: false
    default: ${{ github.token }}
  version:
    description: Version of flyleaf to install.
    required: false
    default: ""

outputs:
  sarif-file:
    description: Path to the SARIF report.
    value: ${{ inputs.sarif-file }}
  brief-file:
    description: Path to the markdown brief.
    value: flyleaf-brief.md
  findings:
    description: Number of active findings.
    value: ${{ steps.brief.outputs.findings }}

runs:
  using: composite
  steps:
    - name: Install flyleaf
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          pipx install "flyleaf==${{ inputs.version }}"
        else
          pipx install flyleaf
        fi

    - name: Run flyleaf brief
      id: brief
      shell: bash
      run: |
        args=(brief)
        if [ -n "${{ inputs.base }}" ]; then args+=("${{ inputs.base }}"); fi
        if [ -n "${{ inputs.head }}" ]; then args+=("${{ inputs.head }}"); fi
        if [ "${{ inputs.baseline }}" = "true" ]; then args+=(--baseline); fi
        args+=(--path "${{ inputs.path }}")

        # Scan once with --fail-on none, then render the other formats from
        # that result. The threshold is applied last, so a failing check still
        # leaves the comment and the annotations behind for the author to read.
        flyleaf "${args[@]}" --fail-on none --format json -o flyleaf-brief.json
        flyleaf render flyleaf-brief.json --format markdown -o flyleaf-brief.md
        flyleaf render flyleaf-brief.json --format sarif -o "${{ inputs.sarif-file }}"
        python3 -c "
        import json, os
        brief = json.load(open('flyleaf-brief.json'))
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            out.write('findings=%d\n' % len(brief['findings']))
        "
        cat flyleaf-brief.md

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const marker = '<!-- flyleaf-brief -->';
          const body = marker + '\n' + fs.readFileSync('flyleaf-brief.md', 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const existing = await github.paginate(
            github.rest.issues.listComments, { owner, repo, issue_number }
          );
          // One comment per pull request, edited in place. A new comment on
          // every push is how a review bot teaches people to ignore it.
          const mine = existing.find((c) => c.body && c.body.includes(marker));
          if (mine) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Apply the severity threshold
      if: ${{ inputs.fail-on != 'none' }}
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        python3 -c "
        import json, os, sys
        order = ['low', 'medium', 'high']
        threshold = order.index(os.environ['FAIL_ON'])
        brief = json.load(open('flyleaf-brief.json'))
        over = [f for f in brief['findings'] if order.index(f['severity']) >= threshold]
        if not over:
            sys.exit(0)
        for finding in over:
            print('%s %s: %s' % (finding['severity'], finding['component_id'], finding['summary']))
        print('%d finding(s) at or above %s.' % (len(over), os.environ['FAIL_ON']), file=sys.stderr)
        sys.exit(1)
        "
